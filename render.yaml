services:
  - type: web
    name: joblens-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --no-audit --no-fund
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AI_PROVIDER
        value: openai
      - key: SCRAPERAPI_API_KEY
        sync: false
      - key: SCRAPERAPI_PREMIUM
        value: false
    autoDeploy: false
    healthCheckPath: /